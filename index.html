<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل Orange Business</title>
<style>
:root{--bg:#fff7f0;--card:#fff;--tx:#1f1f1f;--mut:#666;--or:#ff6600;--bd:#f2d9c6;--wb:#fff3cd;--wt:#7a5b00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171210;--card:#241c18;--tx:#f3ece7;--mut:#b5a89f;--bd:#3d2f27;--wb:#3a3000;--wt:#ffd866}}
:root[data-theme="dark"]{--bg:#171210;--card:#241c18;--tx:#f3ece7;--mut:#b5a89f;--bd:#3d2f27;--wb:#3a3000;--wt:#ffd866}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
header{background:var(--or);color:#fff;padding:16px 14px 12px}
h1{margin:0;font-size:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.lg{height:48px;border-radius:8px;background:#f8f8f8;padding:2px}.fl{height:56px;border-radius:8px;display:block;margin:0 auto 6px;background:#f8f8f8;padding:2px}footer b{display:block;color:var(--tx);font-size:14px}
#q{width:100%;padding:12px 14px;border-radius:12px;border:0;font-size:16px;font-family:inherit;background:#fff;color:#222}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.chip{flex:none;border:1px solid var(--or);color:var(--or);background:transparent;border-radius:20px;padding:6px 14px;font-size:14px;font-family:inherit}
.chip.on{background:var(--or);color:#fff}
main{padding:4px 14px 30px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:10px 0;overflow:hidden}
.hd{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.hd b{font-size:16px}.hd small{display:block;color:var(--mut);font-size:13px}
.ar{color:var(--or);font-size:18px;transition:.2s}
.card.open .ar{transform:rotate(90deg)}
.bd{display:none;padding:0 14px 14px;font-size:14.5px}
.card.open .bd{display:block}
.bd h4{margin:12px 0 4px;color:var(--or)}
.bd ul{margin:4px 0;padding-inline-start:20px}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13px;text-align:center}
th{background:var(--or);color:#fff}
th,td{border:1px solid var(--bd);padding:5px 7px;white-space:nowrap}
td:first-child{font-weight:600;background:rgba(255,102,0,.08)}
.w{background:var(--wb);color:var(--wt);border-radius:8px;padding:6px 10px;margin:8px 0;font-size:13px}
.none{text-align:center;color:var(--mut);padding:30px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:0 14px 20px}
#intro{position:fixed;inset:0;z-index:10;background:linear-gradient(160deg,#ff6600,#ff9a3c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}#intro img{width:200px;max-width:60%;border-radius:16px;background:#f8f8f8;padding:8px}#intro h2{margin:18px 0 4px;font-size:26px}#intro p{margin:0 0 6px;opacity:.95}#intro .tt{font-size:18px;font-weight:700;margin-top:14px}#intro button{margin-top:28px;background:#fff;color:#ff6600;border:0;border-radius:26px;padding:12px 36px;font-size:18px;font-weight:700;font-family:inherit}#intro button+button{margin-top:12px;background:transparent;color:#fff;border:2px solid #fff}#intro button{min-width:250px}#intro.hide{display:none}body.qm header,body.qm .chips,body.qm footer,body.qm #list{display:none}#quizv{display:none;max-width:760px;margin:auto;padding:12px 14px}body.qm #quizv{display:block}.qbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700;color:var(--or)}.qx{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:18px;padding:6px 14px;font-family:inherit;font-size:14px}#hm{background:#f8f8f8;border:0;border-radius:8px;font-size:20px;padding:4px 10px}#dlg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}#dlg.on{display:flex}#dlg div{background:var(--card);color:var(--tx);border-radius:14px;padding:18px;max-width:340px;text-align:center}#dlg button{margin:6px 4px}
.qz{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:10px 0}.qh{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;font-weight:600}.qz h3{margin:12px 0;font-size:17px}.op{display:block;width:100%;text-align:start;margin:8px 0;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:15px;font-family:inherit}.op.ok{background:#1e9e4a;color:#fff;border-color:#1e9e4a}.op.no{background:#d93025;color:#fff;border-color:#d93025}.nx{margin-top:10px;background:var(--or);color:#fff;border:0;border-radius:22px;padding:10px 26px;font-size:16px;font-family:inherit}.sc{font-size:44px;font-weight:800;color:var(--or);text-align:center}.qz p{text-align:center}.ni{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);font-size:16px;background:var(--bg);color:var(--tx);font-family:inherit}.pe{color:#d93025;font-size:13px;min-height:22px;margin:6px 0}.cert{background:linear-gradient(#fffdf8,#fff3e6);color:#3a2a1f;border:3px solid #ff6600;outline:2px solid #f2b27a;outline-offset:-10px;border-radius:12px;padding:28px 16px;text-align:center;margin:10px 0;direction:ltr}.cert img{height:70px;border-radius:8px}.ct{font-size:24px;font-weight:800;color:#ff6600;margin-top:8px;font-family:Georgia,serif}.cs{font-size:16px;color:#8a1c1c;font-weight:700}.cp{margin:12px 0;font-size:14px;text-align:center}.cn{font-size:28px;font-weight:700;font-family:Georgia,serif;color:#8a1c1c;border-bottom:2px solid #ff6600;display:inline-block;padding:0 14px;margin:6px 0}.cl{height:2px;width:60%;margin:16px auto;background:linear-gradient(90deg,transparent,#ff6600,transparent)}.cf{font-size:14px}.cd{font-size:12px;margin-top:8px;color:#666}.cm{text-align:center;color:var(--mut);font-size:13px}.wa{display:inline-block;text-decoration:none;background:#25d366;color:#fff}#cf{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}#cf i{position:absolute;top:-20px;width:9px;height:14px;opacity:.95;animation:fl linear forwards}@keyframes fl{to{transform:translateY(110vh) rotate(720deg)}}.cert.gold{background:linear-gradient(135deg,#fff8dc,#ffe9a8 45%,#fff3c4);border:4px solid #c9971c;outline:2px solid #e8c860;box-shadow:0 0 22px rgba(201,151,28,.55);animation:glow 2s ease-in-out infinite alternate}@keyframes glow{from{box-shadow:0 0 12px rgba(201,151,28,.4)}to{box-shadow:0 0 30px rgba(255,200,60,.9)}}.cert.gold .ct{color:#9a6b00;font-size:26px}.cert.gold .cn{color:#6b1a1a;border-color:#c9971c;font-size:30px}.sl{color:#c9971c;letter-spacing:6px;font-size:14px}.seal{width:64px;height:64px;border-radius:50%;margin:12px auto 0;background:radial-gradient(#ffe27a,#c9971c);color:#fff;font-size:30px;line-height:64px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
</style>

{g:'ns',c:'طريقة البيع',t:'الـ Sales Pitch المختصر والقاعدة الذهبية',s:'One Integrated Portfolio',b:'<p>«إحنا مش مجرد خط أو إنترنت؛ إحنا بنوفر Portfolio متكامل لحلول الشركات: من Connectivity لـ Cybersecurity و Cloud و Digital Workplace و IoT و Managed Services. هدفنا نفهم مشكلة العميل الأول، وبعدها نقدم له الحل المناسب من Partner واحد».</p><h4>One Integrated Portfolio</h4>'+L(['One Accountable Partner','End-to-End Coverage','Measurable Business Impact'])+'<h4>القاعدة الذهبية للبيع</h4>'+L(['اسأل','افهم','حدد المشكلة','قدم الحل','وضح الـ Value','احسب الـ ROI','افضل البيع'])},
{g:'ss',c:'Tele Sales',t:'خطوات مكالمة Tele Sales ناجحة',s:'هدف المكالمة + 8 خطوات',b:'<p><b>الهدف:</b> مش البيع من أول مكالمة، بل فهم احتياج العميل، تقديم قيمة مناسبة، والاتفاق على خطوة تالية واضحة.</p>'+O(['<b>الافتتاح (أول 10 ثواني):</b> عرّف نفسك والشركة بسرعة، واستأذن في الحديث، وكن واثقاً ومختصراً.','<b>كسر الحاجز:</b> اسأل عن المسؤول عن خطوط الشركة. لو نعم أكمل، لو لا اعرف الشخص المسؤول.','<b>اكتشاف الاحتياج:</b> أسئلة مفتوحة: كام خط؟ نفس النظام ولا أنظمة مختلفة؟ مكالمات ولا إنترنت؟ مشكلة في تكلفة الفاتورة؟ موظفين محتاجين خطوط إضافية؟ إمتى آخر مرة راجعتم نظام الخطوط؟','<b>تحديد الـ Pain Point:</b> مثال: «يعني أكتر حاجة مضايقاكم حالياً هي ارتفاع الفاتورة؟»','<b>تقديم الحل:</b> اربط عرضك بالمشكلة، وبيع الفائدة مش الباقة. مثال: «بناءً على استخدامكم، الأنسب ليكم إننا نجمع الخطوط على نظام شركات مناسب بحيث تتحكموا في الاستهلاك وتنقلوا المصروفات»','<b>التعامل مع الاعتراضات:</b> استمع للعميل، افهم ردة، ورد باحترام وإقناع.','<b>الإغلاق (Closing):</b> اقفل باتفاق واضح على الخطوة التالية. مثال: «خلينا نبدأ بمراجعة الخطوط الحالية، حضرتك مناسب ليك أبعتلك التفاصيل النهاردة ولا بكرة؟»','<b>تأكيد الخطوة التالية (Follow-up):</b> قبل الإنهاء تأكد من: اسم العميل، عدد الخطوط، الاحتياج الرئيسي، موعد العرض، العرض المتفق عليه، موعد المتابعة، وسيلة التواصل.'])+'<h4>المعادلة</h4><p>Opening → Qualification → Discovery → Pain → Solution → Objection → Closing → Follow-up</p>'},
{g:'ss',c:'Tele Sales',t:'مواصفات الـ Tele Sales الشاطر',s:'10 مهارات + 3 أخطاء تتجنبها',b:O(['ثقة وطريقة صوت احترافية: صوت واضح، نبرة إيجابية، ابتسامة في الصوت','مهارة الاستماع: اسمع أكتر ما تتكلم','قوة في اكتشاف الاحتياج (Discovery)','فهم قوي للمنتجات والحلول','بيع القيمة وليس السعر','التعامل الذكي مع الاعتراضات','مهارة الإغلاق (Closing)','المتابعة والالتزام','تنظيم وإدارة الوقت','التعلم المستمر من النتائج'])+'<h4>أهم 3 أخطاء تتجنبها</h4>'+L(['تبدأ بالأسعار والباقات فوراً','تتكلم معظم المكالمة والعميل ساكت','تقفل المكالمة من غير خطوة تالية واضحة'])},
{g:'ss',c:'Tele Sales',t:'ردود على اعتراضات المكالمة',s:'«مش محتاجين» · «غالي» · «ابعتلي واتساب»',b:L(['<b>«مش محتاجين»:</b> «ممكن أعرف بس إيه النظام اللي شغالين عليه حالياً؟ ممكن أوضح لحضرتك فرق بسيط يستاهل المقارنة»','<b>«غالي»:</b> «متفهم طبعاً، خلينا نقارن التكلفة الحالية بالاستخدام الفعلي ونشوف هل فيه توفير ولا لأ»','<b>«ابعتلي واتساب»:</b> «أكيد، بس عشان نخلي العرض المناسب مش عام، محتاج أعرف عدد الخطوط والاستخدام تقريباً»'])+'<h4>أمثلة إغلاق</h4>'+L(['«تمام، خلينا نبدأ بمراجعة الخطوط الحالية، حضرتك مناسب ليك أبعتلك التفاصيل النهاردة ولا بكرة؟»','«ممكن نحدد مكالمة 10 دقائق مع حضرتك عشان نراجع الاحتياج ونطلع بالحل المناسب؟»'])+W('النصوص من صورة ممسوحة وبعض الجمل مدمجة باختصار، راجع الأصل.')},
{g:'ss',c:'زيارات ميدانية',t:'خطوات الزيارة الميدانية (Sales Out Door)',s:'9 خطوات من الافتتاح للمتابعة',b:'<p><b>هدف الزيارة:</b> فهم احتياج العميل على أرض الواقع، تقديم حل مناسب، بناء علاقة ثقة، وتنتهي باتفاق واضح وخطوة تالية محددة.</p>'+O(['<b>الافتتاح وبناء الثقة:</b> عرّف نفسك والشركة ووضح سبب الزيارة بشكل مختصر ومحترم (مثلاً: «معاك حضرتك من Aptelecom وكيل Orange Business، جاي عشان نتعرف على احتياجاتكم في الاتصالات»)','<b>كسر الجليد:</b> سؤال عام عن الشركة والنشاط لإظهار الاهتمام.','<b>اكتشاف الاحتياج (Discovery):</b> كام خط؟ أنظمة الخطوط الحالية؟ مشكلة في الفاتورة أو التحكم؟ استخدام مكالمات ولا إنترنت؟ إمتى آخر مرة راجعتم نظام الاتصالات؟','<b>تحديد الـ Pain Point:</b> لخص ما فهمته وتأكد منه («أكتر حاجة بتأثر عليكم هي ارتفاع الفاتورة وصعوبة التحكم في كل خط؟»)','<b>تقديم الحل المناسب:</b> «الحل نظام Orange Business، هتتحكموا في كل الخطوط من نظام واحد، تحددوا الصلاحيات، وتقللوا التكلفة»','<b>عرض الفائدة والأرقام:</b> توفير في التكلفة، تقارير وتحكم كامل في الاستهلاك، دعم فني مخصص للشركات.','<b>التعامل مع الاعتراضات:</b> «غالي» → تكلفة النظام الحالي أعلى عند جمع الخطوط؛ «مش محتاجين دلوقتي» → مراجعة سريعة بدون التزام؛ «هنفكر ونرد» → معاد متابعة قصير لمراجعة التفاصيل.','<b>الإغلاق (Closing):</b> «نبدأ بمراجعة الخطوط الحالية عندكم ونعمل عرض تفصيلي؟» أو «نحدد معاد مع الإدارة المختصة لمناقشة الحل؟»','<b>تأكيد الخطوة التالية:</b> سجل الاتفاقات: اسم المسؤول، الاحتياج الأساسي، عدد الخطوط، موعد المتابعة، وسيلة التواصل.'])},
{g:'ss',c:'زيارات ميدانية',t:'مواصفات السيلز الاوت دور الشاطر',s:'10 مواصفات',b:O(['مظهر احترافي ولباقة عالية','مهارة بناء علاقة (Rapport)','مستمع ممتاز','قوي في الاكتشاف (Discovery)','خبير بالمنتجات والحلول','يبيع القيمة وليس السعر','تعامل احترافي مع الاعتراضات','إغلاق ذكي (Closing)','منظم وملتزم بالمتابعة','يحلل ويتعلم من كل زيارة'])},
{g:'ss',c:'زيارات ميدانية',t:'قبل وأثناء وبعد الزيارة',s:'نصائح ذهبية وأسباب الفشل',b:'<h4>قبل النزول للعميل</h4>'+L(['حدد هدف الزيارة بوضوح','اعرف معلومات عن الشركة والنشاط','جهز عرضك (منتجات – حلول – عروض)','تأكد من الأدوات: بطاقة، بروشور، عقد، موبايل، هدايا رمزية','خطط للطريق والوقت','جهز أفكار لفتح حديث وكسر الجليد'])+'<h4>أثناء الزيارة</h4>'+L(['اهتمام كامل بالعميل وتجنب المقاطعة','لغة جسد إيجابية وتواصل بصري','ركز على احتياج العميل مش مميزاتك','استخدم أمثلة وقصص نجاح','لا تدخل في تفاصيل تقنية معقدة إلا عند الحاجة','حافظ على وقت العميل'])+'<h4>بعد الزيارة</h4>'+L(['أرسل ملخص الزيارة والعرض للعميل','تابع في الموعد المتفق عليه','استمر في بناء العلاقة حتى لو لم يتم الاتفاق الآن','حدث بيانات العميل في النظام','قيم الزيارة وما يمكن تحسينه'])+'<h4>أشهر أسباب فشل الزيارة</h4>'+L(['التحدث كثيراً والاستماع قليلاً','التركيز على السعر بدون قيمة مضافة','عدم فهم احتياج العميل جيداً','عدم التحضير للزيارة','عدم الاتفاق على خطوة تالية'])},
{g:'ss',c:'التعامل مع المواقف',t:'العميل بيماطل؟ الردود المناسبة',s:'6 جمل مماطلة + الماطل بوضوح',b:'<p><b>هدفك:</b> تعرف السبب الحقيقي للتأجيل وتوصل لخطوة محددة.</p>'+T(['لو قال','الرد المناسب','الهدف'],[['«سيبني أفكر»','«أكيد، بس إيه أكتر نقطة محتاج تفكر فيها: السعر، الباقة، ولا الإجراءات؟»','تحديد سبب التفكير'],['«كلمني بعدين»','«تمام، خلينا نحدد وقت مناسب بالضبط، يناسبك بكرة 12 ولا 2؟»','موعد متابعة محدد'],['«هشوف وأرد عليك»','«إيه المعلومة اللي لسه محتاج تعرفها عشان تقدر تاخد القرار؟»','تقديم معلومة ناقصة'],['«مش مستعجل»','«فاهم حضرتك، مش هدفي أضغط؛ خلينا نحدد احتياج الشركة»','ربط القرار بالاحتياج'],['«الوقت مش مناسب»','«ممكن أعرف إمتى يكون الوقت مناسب نرجع نكمل؟»','معرفة التوقيت للمتابعة'],['«السعر غالي»','«خلينا نقارن التكلفة الحالية بالفائدة، ونشوف التوفير على المدى الطويل»','من سعر إلى قيمة وتوفير']])+'<h4>لو حاسس إنه بيماطل بوضوح</h4><p>استخدم Closing مباشر لكن محترم: «خليني أسألك بصراحة يا فندم: لو السعر والحل مناسبين لاحتياج حضرتك، هل في أي سبب تاني ممكن يمنعنا نبدأ؟»</p>'+L(['لو قال لأ: غالباً المشكلة في التردد، ارجع للـ Value وركز على الفائدة واقفل على خطوة محددة','لو قال آه: عرفت الاعتراض الحقيقي، تعامل معه وقدم حل مناسب'])+'<p><b>القاعدة الذهبية:</b> ما تحاوش تكسر المماطلة بالضغط؛ اكسرها بالسؤال.</p>'},
{g:'ss',c:'التعامل مع المواقف',t:'التصرف مع عميل قليل الذوق',s:'5 خطوات + يفضل وممنوع',b:T(['الموقف','الرد المناسب'],[['1) خليك هادي','«أنا متفهم إن حضرتك ممكن تكون مشغول أو متضايق، وهدفي أوصل لحضرتك المعلومة بسرعة»'],['2) بيقاطعك باستمرار','«اسمحلي بس أكمل، النقطة دي في 20 ثانية، وبعدها أسمع رأي حضرتك»'],['3) بيتكلم بعصبية','«متفهم حضرتك، خلينا نحدد المشكلة بالضبط وأنا أشوف أفضل حل»'],['4) تقليل أو إهانة','«أنا تحت أمرك وهدفي أساعدك، لكن خلينا نحافظ على أسلوب محترم عشان أقدر أخدم حضرتك بشكل أفضل»'],['5) استمر في الإهانة','«واضح إن الوقت مش مناسب لحضرتك حالياً، ممكن أنهي المكالمة ونرجع نتواصل في وقت أنسب»']])+'<h4>يفضل تعمل</h4>'+L(['تحافظ على هدوئك وثقتك','تستمع جيداً حتى لو العميل غاضب','تتعاطف بدون مبالغة','تطرح أسئلة تساعده يوضح المشكلة','تقدم حلولاً واضحة وتركز على الفائدة'])+'<h4>ممنوع تعمل</h4>'+L(['ترفع صوتك أو ترد الإهانة بإهانة','تدخل في جدال لإثبات إنك صح','تستخدم سخرية أو استفزاز','تقفل المكالمة بعصبية بدون محاولة تهدئة الموقف','تأخذ الكلام بشكل شخصي أو تظهر انفعال'])+'<h4>لو تجاوز العميل في الإهانة بشكل صريح</h4>'+O(['ضع حداً واضحاً: «أرجو من حضرتك الالتزام بأسلوب محترم»','لو استمر: «إذا استمر الحديث بهذا الأسلوب، سأنهي المكالمة»','أنهِ المكالمة بهدوء، وحدث بيانات العميل وسجل الواقعة'])+'<p><b>قاعدة الذهب:</b> العميل ممكن يكون عصبي... لكن المندوب لازم يفضل محترف.</p>'}
);

function stop(){live=false;clearInterval(tm);sc=0;cx=true;el('dlg').classList.remove('on');el('quizv').innerHTML='<div class="qz"><div class="sc">0 / '+qs.length+'</div><p>تم إلغاء الـ Quiz لأنك خرجت منه، ودرجتك 0.</p>'+snd()+'<div id="acts" style="display:none;text-align:center"><button class="nx" id="re">ابدأ Quiz جديد</button> <button class="qx" id="rh">الرئيسية</button></div></div>';el('re').onclick=quiz;el('rh').onclick=home;lk()}
let pn='';
function askName(){document.body.classList.add('qm');el('quizv').innerHTML='<div class="qz"><h3>اكتب اسمك الثلاثي بالإنجليزي</h3><p style="margin:0 0 8px;color:var(--mut)">مثال: Ahmed Mohamed Ali</p><input id="pn" class="ni" dir="ltr" autocomplete="off" placeholder="First Middle Last"><p style="margin:12px 0 6px;color:var(--mut)">رقم واتساب مديرك (مثال: 01212345678)</p><input id="pm" class="ni" dir="ltr" inputmode="tel" autocomplete="off" placeholder="012XXXXXXXX"><div id="pe" class="pe"></div><div style="text-align:center"><button class="nx" id="ps">ابدأ الـ Quiz</button> <button class="qx" id="pb">رجوع</button></div></div>';
el('ps').onclick=()=>{const v=el('pn').value.trim().replace(/\s+/g,' ');if(!/^[A-Za-z'-]{2,}( [A-Za-z'-]{2,}){2,3}$/.test(v)){el('pe').textContent='اكتب الاسم ثلاثي (3 كلمات) وبحروف إنجليزية فقط.';return}let n=el('pm').value.replace(/[\s+()-]/g,'');if(/^01\d{9}$/.test(n))n='20'+n.slice(1);else if(!/^201\d{9}$/.test(n)){el('pe').textContent='اكتب رقم واتساب المدير صحيح (مثال: 01212345678).';return}wn=n;pn=v.split(' ').map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join(' ');quiz()};
el('pn').onkeydown=e=>{if(e.key==='Enter')el('ps').click()};el('pb').onclick=home;el('pn').focus()}
function cert(){const d=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
el('quizv').innerHTML='<div class="cert'+(sc===qs.length?' gold':'')+'">'+(sc===qs.length?'<div class="sl">✦ ✦ ✦</div>':'')+'<img src="'+el('introimg').src+'" alt="Aptelecom"><div class="ct">'+(sc===qs.length?'👑 Certificate of Excellence':'🏆 Certificate of Appreciation')+'</div><div class="cs">'+(sc===qs.length?'شهادة تميّز':'شهادة تقدير')+'</div><p class="cp">This certificate is proudly presented to</p><div class="cn">'+pn+'</div><p class="cp">for outstanding performance in the Orange Business Quiz,<br>'+(sc===qs.length?'achieving a flawless, perfect score of':'achieving an outstanding score of')+' <b>'+sc+' / '+qs.length+'</b></p><div class="cl"></div><div class="cf">Presented by<br><b>Aptelecom training team</b></div><div class="cd">'+d+'</div>'+(sc===qs.length?'<div class="seal">★</div>':'')+'</div>'+snd()+'<div id="acts" style="display:none;text-align:center"><button class="nx" id="re">Quiz جديد</button> <button class="qx" id="rh">الرئيسية</button></div><p class="cm">📸 خد screenshot للشهادة واحتفظ بيها</p>';party(sc===qs.length);el('re').onclick=quiz;el('rh').onclick=home;lk()}
function dlgm(m,ex){el('dm').textContent=m;el('dx').style.display=ex?'':'none';el('dk').textContent=ex?'كمّل الـ Quiz':'فهمت، كمّل';el('dlg').classList.add('on')}
function startT(){tEnd=Date.now()+40000;tm=setInterval(()=>{const r=Math.ceil((tEnd-Date.now())/1000),t=el('tt');if(!t)return;if(r<=0){clearInterval(tm);timeUp();return}t.textContent='⏱ '+r;t.style.color=r<=10?'#d93025':''},250)}
function nb(){el('fb').innerHTML='<button class="nx" id="nx">'+(qi===qs.length-1?'شوف النتيجة':'التالي')+'</button>';el('nx').onclick=()=>{qi++;qv()}}
function timeUp(){const bs=[...document.querySelectorAll('.op')];if(!live||!bs.length||bs[0].disabled)return;bs.forEach(x=>{x.disabled=true;if(x.textContent===qs[qi].c)x.classList.add('ok')});wr.push({q:qs[qi].q,m:'(انتهى الوقت)',c:qs[qi].c});el('tt').textContent='⌛ انتهى الوقت';el('qsc').textContent='الدرجة: '+sc+' / '+(qi+1);nb()}
document.addEventListener('visibilitychange',()=>{if(!live)return;if(document.hidden){outs++;if(outs>=2)stop()}else if(outs===1)dlgm('⚠️ خرجت من صفحة الـ Quiz. لو خرجت مرة تانية هيتم إلغاء الـ Quiz وتاخد 0.',false)});
function party(big){const c=document.createElement('div');c.id='cf';const k=['#ff6600','#ffc107','#e91e63','#2196f3','#4caf50','#fff'],g=['#ffd700','#ffb300','#fff3b0','#ff6600'],col=big?g.concat(k):k;for(let i=0;i<(big?110:45);i++){const p=document.createElement('i');p.style.cssText='left:'+Math.random()*100+'%;background:'+col[i%col.length]+';animation-duration:'+(2.5+Math.random()*3)+'s;animation-delay:'+Math.random()*(big?1.5:.8)+'s;transform:rotate('+Math.random()*360+'deg)';c.appendChild(p)}document.body.appendChild(c);setTimeout(()=>c.remove(),big?7000:5000)}
let wn='',wr=[],needSend=false,cx=false;
function msg(){const d=new Date().toLocaleDateString('en-GB');let t='📋 نتيجة Quiz - Orange Business\n👤 الاسم: '+pn+'\n🎯 الدرجة: '+sc+' / '+qs.length+'\n📅 التاريخ: '+d;if(cx)t+='\n⚠️ تم إلغاء الـ Quiz بسبب الخروج من الصفحة';if(wr.length){t+='\n\n❌ الأخطاء ('+wr.length+'):\n'+wr.slice(0,5).map((w,i)=>(i+1)+') '+w.q.slice(0,50)+'\n   إجابته: '+w.m.slice(0,40)+'\n   الصح: '+w.c.slice(0,40)).join('\n');if(wr.length>5)t+='\n... و'+(wr.length-5)+' أخطاء أخرى'}else if(!cx)t+='\n\n✅ بدون أخطاء';return t+'\n\n— Aptelecom training team'}
function snd(){return '<p style="color:#d93025;font-weight:700;margin:10px 0 0;text-align:center">لازم تبعت نتيجتك للمدير قبل ما تكمل</p><div style="text-align:center"><a class="nx wa" id="wa" target="_blank" rel="noopener" href="https://wa.me/'+wn+'?text='+encodeURIComponent(msg())+'">📤 ابعت النتيجة للمدير (واتساب)</a></div>'}
function lk(){needSend=true;log();el('wa').onclick=()=>{needSend=false;setTimeout(()=>{el('acts').style.display=''},500)}}
const SHEET_URL='';let lg=false;
function log(){if(!SHEET_URL||lg)return;lg=true;const d=new Date();try{fetch(SHEET_URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},body:JSON.stringify({time:d.toLocaleString('en-GB'),name:pn,manager:wn,score:sc,total:qs.length,status:cx?'Cancelled':'Completed',wrong:wr.map((w,i)=>(i+1)+') '+w.q+' | answer: '+w.m+' | correct: '+w.c).join('\n')})})}catch(e){}}
function pick(){const ob=Q.filter(x=>!NS.has(x)),oo=ob.filter(x=>/خارج|بعد نفاذ/.test(x[0])),ot=ob.filter(x=>!oo.includes(x)),ns=Q.filter(x=>NS.has(x));return sh(sh(oo).slice(0,4).concat(sh(ot).slice(0,4),sh(ns).slice(0,2)))}
</script>
