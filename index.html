html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}

.chip{flex:none;border:1px solid var(--or);color:var(--or);background:transparent;border-radius:20px;padding:6px 14px;font-size:14px;font-family:inherit}

.ar{color:var(--or);font-size:18px;transition:.2s}
.card.open .ar{transform:rotate(90deg)}
.bd{display:none;padding:0 14px 14px;font-size:14.5px}
.card.open .bd{display:block}
.bd h4{margin:12px 0 4px;color:var(--or)}
.bd ul{margin:4px 0;padding-inline-start:20px}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13px;text-align:center}
th{background:var(--or);color:#fff}
th,td{border:1px solid var(--bd);padding:5px 7px;white-space:nowrap}
td:first-child{font-weight:600;background:rgba(255,102,0,.08)}
.w{background:var(--wb);color:var(--wt);border-radius:8px;padding:6px 10px;margin:8px 0;font-size:13px}
.none{text-align:center;color:var(--mut);padding:30px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:0 14px 20px}
</style>

D.forEach(d=>{const t=document.createElement('div');t.innerHTML=d.b;d.x=N(d.t+' '+d.s+' '+d.c+' '+t.textContent)});
function chips(){el('chips').innerHTML=cats.map(c=>'<button class="chip'+(c===cat?' on':'')+'" data-c="'+c+'">'+c+'</button>').join('')}
function draw(){const q=N(el('q').value.trim());const r=D.filter(d=>(cat==='الكل'||d.c===cat)&&(!q||d.x.includes(q)));
el('list').innerHTML=r.length?r.map(d=>'<div class="card'+(q&&r.length<3?' open':'')+'"><div class="hd"><div><b>'+d.t+'</b><small>'+d.s+'</small></div><span class="ar">◀</span></div><div class="bd">'+d.b+'</div></div>').join(''):'<div class="none">مفيش نتائج مطابقة. جرّب كلمة تانية.</div>'}
el('chips').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;chips();draw()}};
el('list').onclick=e=>{const h=e.target.closest('.hd');if(h)h.parentNode.classList.toggle('open')};
el('q').oninput=draw;chips();draw();
</script>
</body>
</html>
